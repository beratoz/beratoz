<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 20" width="800" height="20" role="img" aria-label="neon divider">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset=".22" stop-color="#00f0ff"/>
      <stop offset=".5" stop-color="#ff2a6d"/>
      <stop offset=".78" stop-color="#b100ff"/>
      <stop offset="1" stop-color="#b100ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="800" height="20">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="9" width="800" height="2" fill="url(#g)" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.6;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <path d="M390,10 L400,1 L410,10 L400,19 Z" fill="#05000f" stroke="#ff2a6d" stroke-width="1.5" filter="url(#glow)"/>
  <circle cy="10" r="2.5" fill="#fff" filter="url(#glow)">
    <animate attributeName="cx" values="60;740;60" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
